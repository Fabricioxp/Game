}
// REFERENCIAL DA SUBIDA: o foguete/câmera permanece na cabine e todo o planeta fica para baixo.
// Solo, montanhas, árvores e névoa compartilham exatamente o mesmo deslocamento, impedindo o efeito de cenário colado na tela.
const targetTerrainDrop=Math.min(2200, s.alt*.028);
visualTerrainDrop=smoothTo(visualTerrainDrop,targetTerrainDrop,2.8,rawDt);
const terrainDrop=visualTerrainDrop;
const terrainRetreat=Math.min(1600, s.alt*.018);
ground.position.y=-2.35-terrainDrop;
ground.position.z=-terrainRetreat;
scenery.position.y=-terrainDrop;
scenery.position.z=-terrainRetreat;
const sceneryFade=Math.max(0,1-Math.max(0,s.alt-18000)/72000);
scenery.visible=sceneryFade>.01;
scenery.traverse(o=>{if(o.material&&'opacity' in o.material){o.material.transparent=true;o.material.opacity=Math.min(1,sceneryFade);}});
// A paisagem de solo desaparece gradualmente antes do espaço profundo, em vez de permanecer visível até o espaço.
const groundFade=Math.max(0,1-Math.max(0,s.alt-12000)/70000);
ground.visible=groundFade>.01;
ground.material.transparent=true;ground.material.opacity=groundFade;
land.position.y=-2.4-terrainDrop;
land.position.z=-terrainRetreat;
distantRidges.position.y=-terrainDrop;
distantRidges.position.z=-terrainRetreat;
const inEntry=s.state==='ENTRY'||s.state==='LANDING'||s.state==='LANDED'||s.state==='LANDER_DESCENT';
const entryMix=inEntry?Math.max(0,Math.min(1,(140-s.landingAlt)/140)):0;
if(inEntry){
  // Na descida, o terreno volta a se aproximar naturalmente do piloto.
  const approachY=Math.max(-2.4,-2.4-(Math.max(0,s.landingAlt-12)*.18));
  land.position.y=approachY;
  distantRidges.position.y=approachY+2.4;
  scene.background.setRGB(.012+.19*entryMix,.012+.043*entryMix,.018+.017*entryMix);
  const spaceFade=Math.max(.18,1-entryMix*.82);
  starMat.opacity=Math.min(starMat.opacity,spaceFade);
  nebulaA.material.opacity*=spaceFade;nebulaB.material.opacity*=spaceFade;nebulaC.material.opacity*=spaceFade;
  marsMat.opacity=Math.max(0,(1-entryMix*.92)*Math.max(.25,marsMat.opacity));
  marsAtmoMat.opacity=Math.max(.02,(1-entryMix*.75)*marsAtmoMat.opacity);
  const landFade=Math.max(0,Math.min(1,(entryMix-.34)/.66));
  land.visible=landFade>0.01;distantRidges.visible=landFade>0.01;
  land.material.transparent=true;land.material.opacity=landFade;
  distantRidges.children.forEach(r=>{r.material.transparent=true;r.material.opacity=landFade;});
  const haze=Math.max(.02,entryMix);
  scene.fog.color.setRGB(.06+.29*haze,.025+.085*haze,.03+.055*haze);
  scene.fog.density=.00008+haze*.0024;
  land.material.color.setRGB(.18+.30*haze,.055+.11*haze,.045+.065*haze);
}else{
  stars.visible=true;nebulaA.visible=nebulaB.visible=nebulaC.visible=true;
  land.visible=false;distantRidges.visible=false;
}
engineLight.intensity=(s.state==='IGNITION'||s.state==='ASCENT')?2.2*Math.min(1,s.thrust/8200000):.15;
if(clips.launchNatural){const engine=clips.launchNatural;if((s.state==='ASCENT'||s.state==='SPACE')&&engine.paused&&audioOn){engine.play().catch(()=>{});}const fadeStart=95000, fadeEnd=115000;const fade=Math.max(0,Math.min(1,(fadeEnd-s.alt)/(fadeEnd-fadeStart)));if(s.alt<fadeStart)engine.volume=.52;else engine.volume=.52*Math.max(.06,fade);if(s.state==='CRUISE'||s.state==='APPROACH'||s.state==='ENTRY'||s.state==='LANDING')stopClip('launchNatural');}
const sh=s.shake;
cockpit.position.x=(Math.random()-.5)*sh;
cockpit.position.y=(Math.random()-.5)*sh*.65;
cockpit.rotation.z=(Math.random()-.5)*sh*.04;
const targetBlend=cameraMode==='EXTERNA'?1:0;
cameraBlend+=(targetBlend-cameraBlend)*Math.min(1,rawDt*2.2);
rocket.visible=cameraMode==='EXTERNA' && sim.state!=='READY' && sim.state!=='COUNT';
if(rocket.visible){
  const gravityTurn=Math.max(0,Math.min(1,(s.alt-12000)/110000));
  rocket.position.set(0,-12,-38);
  rocket.rotation.set(0,sim.t*.018,-gravityTurn*.18+Math.sin(sim.t*.8)*sim.shake*.045);
  flameGroup.visible=sim.thrust>1000;
  engineGlow.intensity=sim.thrust>1000?4.5:0;
  if(manual.boosters){
    const separation=Math.min(30,Math.max(0,(s.alt-42000)*.00065));
    rocket.children.forEach(o=>{
      if(Math.abs(o.position.x)>4&&Math.abs(o.position.x)<6){
        if(o.userData.baseX===undefined){o.userData.baseX=o.position.x;o.userData.baseY=o.position.y;}
        o.position.x=o.userData.baseX+Math.sign(o.userData.baseX)*separation;
        o.position.y=o.userData.baseY-separation*.72;
      }
    });
  }
}
// O piloto permanece sentado: todos os comandos importantes ficam dentro do alcance visual e tátil.
// TRANSFERÊNCIA CINEMATOGRÁFICA ENTRE DUAS NAVES REAIS.
const mainCabPos=new THREE.Vector3(0,.82,1.42);
const landerCabPos=new THREE.Vector3(7,.64,1.34);
let cabPos=mainCabPos;
if(s.state==='MODULE_TRANSFER'){
  // Sem câmera atravessando o espaço: o desacoplamento é visto fisicamente e a troca ocorre apenas quando o piloto entra no módulo.
  cockpit.visible=true;
  landerCabin.visible=false;
  cabPos=mainCabPos;
}else if(s.vehicle==='LANDER'||['LANDER_DESCENT','ENTRY','LANDING','LANDED'].includes(s.state)){
  cockpit.visible=false;landerCabin.visible=true;cabPos=landerCabPos;
}else{cockpit.visible=true;landerCabin.visible=false;cabPos=mainCabPos;}
const gravityTurn=Math.max(0,Math.min(1,(s.alt-18000)/95000));
const extPos=new THREE.Vector3(9.5+gravityTurn*2.2,5.8-gravityTurn*.8,14.5-gravityTurn*1.4);
camera.position.copy(cabPos.clone().lerp(extPos,cameraBlend));
if(cameraBlend<.985){
  const targetRot=new THREE.Euler(pitch,yaw,0,'YXZ');
  camera.rotation.x+=(targetRot.x-camera.rotation.x)*.16;
  camera.rotation.y+=(targetRot.y-camera.rotation.y)*.16;
  camera.rotation.z+=(targetRot.z-camera.rotation.z)*.16;
}else{
  camera.lookAt(0,6,-34);
}
physicalButtons.forEach(b=>{if(b.userData.pulse&&missionControl.required===b.userData.action){const q=.5+.5*Math.sin(performance.now()*.012);b.userData.cap.material.emissiveIntensity=1.4+q*3.6;b.userData.led.material.emissiveIntensity=2+q*7;b.userData.cap.scale.setScalar(1+q*.09);b.userData.led.scale.setScalar(1+q*.35);}else{b.userData.cap.scale.setScalar(1);}});phaseEl.textContent=phaseName();updateScreens();drawDashboard();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2))});
})();
