<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0d0b">
<title>O HOSPITAL — Studio Mobile V7</title>
<style>
:root{
 --bg:#080b09;--panel:#111713;--panel2:#17201a;--line:#2b372f;--text:#eef3ef;
 --muted:#91a096;--accent:#b8e35f;--accent2:#7dbdff;--danger:#ff6871;--gold:#f2c76d;
 --safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea,select{font:inherit}
button{color:inherit}
#app{height:100dvh;display:flex;flex-direction:column}
#top{height:58px;min-height:58px;display:flex;align-items:center;gap:8px;padding:7px 10px;background:#0c100d;border-bottom:1px solid var(--line);z-index:30}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#d7ef88,#6d9b37);color:#10150d;display:grid;place-items:center;font-weight:1000;box-shadow:0 5px 18px #0007}
#projectName{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.topbtn{height:42px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:0 12px;font-weight:800}
.topbtn.primary{background:var(--accent);color:#11180d;border-color:#d7ef88}
#workspace{position:relative;flex:1;min-height:0;overflow:hidden;background:#0b0f0c}
#canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#gridOverlay{position:absolute;inset:0;pointer-events:none}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:8px 13px;border:1px solid #36443a;background:#0c110eee;border-radius:999px;color:#d9e3dc;font-size:12px;font-weight:800;z-index:5;white-space:nowrap}
#selectionHud{position:absolute;display:none;z-index:10;pointer-events:none}
#selectionHud .handle{width:20px;height:20px;border-radius:50%;background:#dff59a;border:3px solid #15200f;box-shadow:0 2px 9px #0009}
#selectionHud .label{margin-top:5px;background:#0b100ce8;border:1px solid #5a704d;border-radius:8px;padding:5px 8px;font-size:11px;font-weight:900}
#leftRail{position:absolute;left:10px;top:72px;bottom:78px;width:66px;display:flex;flex-direction:column;gap:7px;z-index:15}
.railBtn{width:66px;min-height:58px;border:1px solid var(--line);border-radius:16px;background:#101611eF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px;box-shadow:0 8px 20px #0005}
.railBtn small{font-size:9px;font-weight:900;color:#bdc9c0}
.railBtn.active{border-color:#8eaa69;background:#26331f}
#rightSheet,#bottomSheet,#modal{position:absolute;z-index:40;background:#0d120fF8;border:1px solid var(--line);box-shadow:0 20px 50px #000b;backdrop-filter:blur(16px)}
#rightSheet{top:8px;right:8px;bottom:8px;width:min(370px,calc(100vw - 92px));border-radius:20px;transform:translateX(115%);transition:.22s ease;overflow:auto}
#rightSheet.open{transform:none}
.sheetHead{position:sticky;top:0;background:#0d120ff5;padding:14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);z-index:2}
.sheetHead strong{flex:1}
.close{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel2)}
.sheetBody{padding:12px}
.card{border:1px solid var(--line);background:#121914;border-radius:15px;padding:12px;margin-bottom:9px}
.cardTitle{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.08em;margin-bottom:9px}
.bigAction{width:100%;min-height:54px;border:1px solid #3b4c40;background:#17211a;border-radius:14px;font-weight:900;text-align:left;padding:10px 12px;margin:5px 0}
.bigAction:active,.railBtn:active,.topbtn:active{transform:scale(.98)}
.assetGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.asset{min-height:76px;border:1px solid var(--line);background:#151e18;border-radius:15px;padding:8px;display:flex;align-items:center;gap:9px;text-align:left}
.asset .ico{font-size:25px;width:34px;text-align:center}.asset b{font-size:11px}.asset small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
#bottomSheet{left:50%;bottom:10px;width:min(720px,calc(100vw - 20px));border-radius:22px;transform:translate(-50%,120%);transition:.22s ease;max-height:min(72dvh,600px);overflow:auto}
#bottomSheet.open{transform:translate(-50%,0)}
#bottomNav{height:72px;min-height:72px;padding:7px 9px calc(7px + var(--safe));display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:#090d0bf5;border-top:1px solid var(--line);z-index:30}
.navBtn{border:1px solid var(--line);border-radius:14px;background:#131b16;font-weight:900;font-size:10px;display:flex;flex-direction:column;justify-content:center;gap:2px}.navBtn span{font-size:21px}.navBtn.active{background:#273520;border-color:#7f9a5e}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:100;background:#dff59a;color:#11180d;padding:10px 14px;border-radius:999px;font-weight:900;font-size:12px;display:none;box-shadow:0 8px 30px #0008;max-width:88vw;text-align:center}
#modal{left:50%;top:50%;transform:translate(-50%,-50%);width:min(650px,calc(100vw - 24px));max-height:88dvh;border-radius:22px;display:none;overflow:auto}
#modal.open{display:block}
.field{margin:9px 0}.field label{display:block;color:var(--muted);font-size:10px;font-weight:900;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0b100d;color:var(--text);border-radius:11px;padding:11px;outline:none}.field textarea{min-height:86px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;color:#c9d3cc;background:#111812}
#playOverlay{position:absolute;inset:0;background:#050806;z-index:80;display:none}
#playOverlay.open{display:block}
#gameCanvas{width:100%;height:100%;display:block;touch-action:none}
#gameHud{position:absolute;inset:0;pointer-events:none}
#gameTop{position:absolute;left:14px;right:14px;top:12px;display:flex;align-items:center;gap:8px}
.hp{width:150px;height:14px;background:#222;border:1px solid #465047;border-radius:99px;overflow:hidden}.hp i{display:block;height:100%;background:#d95b5f;width:100%}
#objective{margin-left:auto;background:#0a0f0cdd;border:1px solid #37453b;border-radius:12px;padding:9px 11px;font-size:11px;font-weight:900;max-width:54vw}
#joy{position:absolute;left:18px;bottom:22px;width:128px;height:128px;border-radius:50%;background:#0b100cb5;border:1px solid #627066;pointer-events:auto}
#knob{position:absolute;left:38px;top:38px;width:52px;height:52px;border-radius:50%;background:#dff59a;border:3px solid #16200f}
.gameAction{position:absolute;right:18px;bottom:25px;width:72px;height:72px;border-radius:50%;border:1px solid #a5b58f;background:#25331fdd;font-size:28px;pointer-events:auto}
.gameAction.small{width:52px;height:52px;right:95px;bottom:34px;font-size:19px}
#dialogue{position:absolute;left:12px;right:12px;bottom:16px;background:#080d0beF;border:1px solid #536155;border-radius:18px;padding:13px;display:none;pointer-events:auto}
#dialogue b{display:block;color:#dff59a;font-size:12px;margin-bottom:5px}#dialogue p{margin:0;font-size:13px;line-height:1.4}
#dialogue button{margin-top:9px;width:100%;height:40px;border:1px solid #51614f;border-radius:10px;background:#182219;font-weight:900}
.sectionTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}.sectionTabs button{height:38px;border:1px solid var(--line);background:#111812;border-radius:10px;font-size:10px;font-weight:900}.sectionTabs button.active{background:#2b3b25;border-color:#78935a}
.listItem{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#111812;border-radius:12px;padding:9px;margin:6px 0}.listItem .grow{flex:1}.listItem b{font-size:11px}.listItem small{display:block;color:var(--muted);font-size:9px}.miniBtn{width:36px;height:36px;border:1px solid var(--line);background:#182119;border-radius:10px}
@media(max-width:720px){
 #leftRail{left:7px;width:55px;top:66px}.railBtn{width:55px;min-height:54px;border-radius:14px}
 #rightSheet{width:calc(100vw - 14px);right:7px;top:7px;bottom:7px}
 #hint{top:8px;font-size:10px}.topbtn{padding:0 9px}
}
@media(min-width:900px){
 #bottomNav{display:none}
 #workspace{height:calc(100dvh - 58px)}
}
</style>
</head>
<body>
<div id="app">
<header id="top">
 <div class="logo">OH</div><div id="projectName">O HOSPITAL — Studio</div>
 <button class="topbtn" id="undo">↶</button><button class="topbtn" id="redo">↷</button>
 <button class="topbtn" id="save">💾</button><button class="topbtn primary" id="play">▶ TESTAR</button>
</header>
<main id="workspace">
 <canvas id="canvas"></canvas>
 <div id="hint">Toque em CONSTRUIR para colocar algo • arraste objetos diretamente</div>
 <div id="selectionHud"><div class="handle"></div><div class="label" id="selectionLabel"></div></div>
 <aside id="leftRail">
  <button class="railBtn active" data-mode="build">🧱<small>CONSTRUIR</small></button>
  <button class="railBtn" data-mode="scenes">🏥<small>CENAS</small></button>
  <button class="railBtn" data-mode="story">📖<small>HISTÓRIA</small></button>
  <button class="railBtn" data-mode="audio">🔊<small>ÁUDIO</small></button>
  <button class="railBtn" data-mode="assets">🎨<small>ARTE</small></button>
 </aside>
 <aside id="rightSheet">
  <div class="sheetHead"><strong id="sheetTitle">Construir</strong><button class="close" id="closeSheet">×</button></div>
  <div class="sheetBody" id="sheetBody"></div>
 </aside>
 <div id="bottomSheet"><div class="sheetHead"><strong id="bottomTitle">Ações</strong><button class="close" id="closeBottom">×</button></div><div class="sheetBody" id="bottomBody"></div></div>
</main>
<nav id="bottomNav">
 <button class="navBtn active" data-mode="build"><span>🧱</span>CONSTRUIR</button>
 <button class="navBtn" data-mode="scenes"><span>🏥</span>CENAS</button>
 <button class="navBtn" data-mode="story"><span>📖</span>HISTÓRIA</button>
 <button class="navBtn" data-mode="audio"><span>🔊</span>ÁUDIO</button>
 <button class="navBtn" data-mode="assets"><span>🎨</span>ARTE</button>
</nav>
<div id="toast"></div>
<div id="modal"><div class="sheetHead"><strong id="modalTitle"></strong><button class="close" id="modalClose">×</button></div><div class="sheetBody" id="modalBody"></div></div>

<section id="playOverlay">
 <canvas id="gameCanvas"></canvas>
 <div id="gameHud">
  <div id="gameTop"><div class="hp"><i id="hpbar"></i></div><div class="pill">♥ <span id="hpText">100</span></div><div id="objective">Objetivo: explorar a área</div></div>
  <div id="joy"><div id="knob"></div></div>
  <button class="gameAction small" id="runBtn">🏃</button><button class="gameAction" id="actBtn">◎</button>
  <div id="dialogue"><b id="speaker"></b><p id="dialogueText"></p><button id="dialogueNext">CONTINUAR</button></div>
 </div>
</section>

<input id="assetInput" type="file" accept="image/*,audio/*" multiple hidden>
<input id="projectInput" type="file" accept=".ohospital,.json,application/json" hidden>

<script>
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d');
const gameCanvas=$('gameCanvas'),gctx=gameCanvas.getContext('2d');
let DPR=Math.min(devicePixelRatio||1,2);
let view={x:0,y:0,z:1}, selected=null, drag=null, pan=null, pointers=new Map(), mode='build', pendingType=null, grid=true;
let undo=[],redo=[];

const ASSETS=[
 ['AMBIENTE',[['floor','▦','Piso clínico'],['wall','▥','Parede hospitalar'],['door','🚪','Porta'],['window','▱','Janela'],['column','▥','Coluna']]],
 ['MÓVEIS',[['bed','▰','Cama'],['stretcher','▱','Maca'],['desk','▰','Balcão'],['chair','◼','Cadeira'],['locker','▥','Armário'],['shelf','▤','Estante'],['crate','□','Caixa']]],
 ['ATMOSFERA',[['lamp','◉','Lâmpada'],['blood','●','Sangue'],['corpse','▬','Corpo'],['paper','▤','Documento'],['trash','◆','Lixo'],['plant','♣','Planta']]],
 ['GAMEPLAY',[['player','●','Jogador'],['enemy','◉','Infectado'],['item','◇','Item'],['weapon','†','Arma'],['safe','▣','Cofre'],['trigger','◌','Evento'],['npc','●','NPC']]]
];
const T={
 floor:{w:1,h:1,solid:false},wall:{w:1,h:.45,solid:true},door:{w:1,h:.25,solid:true,open:false,locked:false},
 window:{w:1,h:.12,solid:true},column:{w:.45,h:.45,solid:true},bed:{w:1.9,h:.75,solid:true,interactive:true},
 stretcher:{w:1.8,h:.6,solid:true},desk:{w:1.7,h:.7,solid:true},chair:{w:.65,h:.65,solid:true},locker:{w:.75,h:.45,solid:true,interactive:true},
 shelf:{w:1.6,h:.45,solid:true},crate:{w:.75,h:.75,solid:true},lamp:{w:.25,h:.25,light:true,radius:4},blood:{w:1,h:.6},
 corpse:{w:1.3,h:.55,interactive:true},paper:{w:.45,h:.35,interactive:true},trash:{w:.55,h:.55},plant:{w:.65,h:.65},
 player:{w:.55,h:.55,solid:true},enemy:{w:.58,h:.58,solid:true,speed:1.3,damage:12,vision:6},item:{w:.4,h:.4,interactive:true,itemId:'chave'},
 weapon:{w:.5,h:.25,interactive:true,itemId:'faca'},safe:{w:.85,h:.6,solid:true,interactive:true,code:'1409'},trigger:{w:1.8,h:1.8},npc:{w:.55,h:.55,interactive:true}
};
const colors={floor:'#26302b',wall:'#7d8881',door:'#705e48',window:'#4d7280',column:'#5e6862',bed:'#6d7e88',stretcher:'#87918e',desk:'#665a4d',chair:'#777066',locker:'#4b5552',shelf:'#544d43',crate:'#765e45',lamp:'#d7b85e',blood:'#762f32',corpse:'#464b49',paper:'#b8ad8e',trash:'#4b504c',plant:'#42634a',player:'#cde97e',enemy:'#c65c63',item:'#d6bd63',weapon:'#d4d7d2',safe:'#5e6f75',trigger:'#7097b9',npc:'#75a5d6'};
function uid(){return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function cp(v){return JSON.parse(JSON.stringify(v))}
function obj(type,x,y,extra={}){return {id:uid(),type,x,y,...cp(T[type]||{}),name:extra.name||ASSETS.flatMap(a=>a[1]).find(a=>a[0]===type)?.[2]||type,...extra}}
function defaultProject(){return {version:7,name:'O HOSPITAL',appVersion:'0.7.0',scene:'Recepção',map:{w:34,h:22,t:34},settings:{ambient:.42,quality:'alta'},objects:[
 obj('floor',17,11,{w:34,h:22,name:'Piso principal'}),obj('wall',17,1,{w:34,h:.45,name:'Parede norte'}),obj('wall',17,21,{w:34,h:.45,name:'Parede sul'}),obj('wall',1,11,{w:.45,h:20,name:'Parede oeste'}),obj('wall',33,11,{w:.45,h:20,name:'Parede leste'}),
 obj('desk',17,5,{name:'Recepção'}),obj('lamp',17,4,{name:'Luz da recepção',radius:5}),obj('bed',9,9,{name:'Maca 01'}),obj('bed',12,9,{name:'Maca 02'}),obj('locker',15,12,{name:'Armário'}),obj('safe',26,15,{name:'Cofre de emergência'}),
 obj('player',17,16,{name:'Paciente'}),obj('enemy',25,10,{name:'Infectado',speed:1.25}),obj('enemy',9,15,{name:'Infectado 2',speed:1.05}),obj('item',22,16,{name:'Chave da farmácia',itemId:'farmacia'}),
 obj('paper',14,6,{name:'Prontuário',message:'Paciente 237 — evacuação interrompida às 03:17.'}),obj('trigger',29,6,{name:'Evento: corredor escuro'}),
 obj('npc',6,6,{name:'Enfermeira',dialogue:'Você não deveria estar aqui. A energia caiu em todo o hospital.'})
],story:{chapter:'Capítulo 1 — A Última Chamada',intro:'O hospital perdeu energia. Você acorda sozinho na recepção.',objective:'Encontre a chave da farmácia e descubra o que aconteceu.',dialogues:[{speaker:'Enfermeira',text:'Pegue a chave. Não acenda as luzes do corredor.'},{speaker:'Paciente',text:'Quem mais está aqui?'},{speaker:'Enfermeira',text:'Não sei. E não quero descobrir.'}]},audio:{music:true,ambience:true,sfx:true},assets:[]}}
let project=defaultProject();

function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(window.__t);window.__t=setTimeout(()=>$('toast').style.display='none',1700)}
function saveHistory(){undo.push(cp(project));if(undo.length>40)undo.shift();redo=[]}
$('undo').onclick=()=>{if(undo.length){redo.push(cp(project));project=undo.pop();selected=null;render();toast('Desfeito')}};$('redo').onclick=()=>{if(redo.length){undo.push(cp(project));project=redo.pop();selected=null;render();toast('Refeito')}};
function resize(){DPR=Math.min(devicePixelRatio||1,2);let r=canvas.getBoundingClientRect();canvas.width=r.width*DPR;canvas.height=r.height*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);fit()}
addEventListener('resize',resize);

function fit(){let w=canvas.clientWidth,h=canvas.clientHeight,t=project.map.t*view.z;view.z=Math.min((w-120)/(project.map.w*project.map.t),(h-80)/(project.map.h*project.map.t));view.x=(w-project.map.w*project.map.t*view.z)/2;view.y=(h-project.map.h*project.map.t*view.z)/2;draw()}
function world(sx,sy){return{x:(sx-view.x)/view.z/project.map.t,y:(sy-view.y)/view.z/project.map.t}}
function screen(x,y){return{x:view.x+x*project.map.t*view.z,y:view.y+y*project.map.t*view.z}}
function hit(p){for(let i=project.objects.length-1;i>=0;i--){let o=project.objects[i];if(Math.abs(p.x-o.x)<=o.w/2&&Math.abs(p.y-o.y)<=o.h/2)return o}return null}
function shade(hex,a){let n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;let f=a;return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`}
function drawObj(o){
 let s=screen(o.x,o.y),w=o.w*project.map.t*view.z,h=o.h*project.map.t*view.z;
 if(o.type==='floor'){ctx.fillStyle='#202a25';ctx.fillRect(s.x-w/2,s.y-h/2,w,h);return}
 let c=colors[o.type]||'#777';let lift=(o.type==='wall'||o.type==='column'||o.type==='door')?Math.min(18,h*.35):Math.min(8,h*.2);
 ctx.save();ctx.translate(s.x,s.y);
 ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(5,h*.42,Math.max(8,w*.42),Math.max(3,h*.13),0,0,Math.PI*2);ctx.fill();
 if(o.type==='lamp'){let g=ctx.createRadialGradient(0,0,3,0,0,w*3);g.addColorStop(0,'#fff7c2aa');g.addColorStop(1,'#fff7c200');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,w*3,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle=shade(c,.72);ctx.fillRect(-w/2,-h/2+lift,w,h);
 ctx.fillStyle=c;ctx.fillRect(-w/2,-h/2,w,h);
 ctx.fillStyle='#ffffff20';ctx.fillRect(-w/2,-h/2,w,Math.max(2,h*.12));
 if(o.type==='bed'){ctx.fillStyle='#b9c2bf';ctx.fillRect(-w*.38,-h*.26,w*.76,h*.52);ctx.fillStyle='#8c9995';ctx.fillRect(w*.18,-h*.23,w*.2,h*.45)}
 if(o.type==='enemy'){ctx.fillStyle='#1a1d1b';ctx.beginPath();ctx.arc(-w*.16,-h*.1,3,0,7);ctx.arc(w*.16,-h*.1,3,0,7);ctx.fill()}
 if(o.type==='player'||o.type==='npc'){ctx.fillStyle='#e9eee7';ctx.beginPath();ctx.arc(0,-h*.16,Math.max(5,w*.24),0,7);ctx.fill()}
 if(o.type==='lamp'){ctx.fillStyle='#fff1a1';ctx.beginPath();ctx.arc(0,0,Math.max(4,w*.2),0,7);ctx.fill()}
 if(o.type==='safe'){ctx.strokeStyle='#d4e1df';ctx.lineWidth=2;ctx.strokeRect(-w*.25,-h*.18,w*.5,h*.36)}
 if(o.type==='item'||o.type==='weapon'){ctx.strokeStyle='#fff2b2';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-w*.2,0);ctx.lineTo(0,-h*.25);ctx.lineTo(w*.2,0);ctx.lineTo(0,h*.25);ctx.closePath();ctx.stroke()}
 if(o.id===selected){ctx.strokeStyle='#dff59a';ctx.lineWidth=2.5;ctx.setLineDash([6,4]);ctx.strokeRect(-w/2-4,-h/2-4,w+8,h+8);ctx.setLineDash([])}
 ctx.restore();
}
function draw(){
 let w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);
 let bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#0a0f0c');bg.addColorStop(1,'#111915');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.z,view.z);ctx.translate(-view.x/view.z,-view.y/view.z);
 // grid is drawn in screen/world hybrid for crispness
 ctx.restore();
 ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.z,view.z);
 let t=project.map.t, mw=project.map.w*t,mh=project.map.h*t;
 ctx.fillStyle='#161e1a';ctx.fillRect(0,0,mw,mh);
 if(grid){ctx.strokeStyle='#27332c';ctx.lineWidth=1/view.z;for(let x=0;x<=project.map.w;x++){ctx.beginPath();ctx.moveTo(x*t,0);ctx.lineTo(x*t,mh);ctx.stroke()}for(let y=0;y<=project.map.h;y++){ctx.beginPath();ctx.moveTo(0,y*t);ctx.lineTo(mw,y*t);ctx.stroke()}}
 ctx.restore();
 [...project.objects].sort((a,b)=>(a.y+a.h)-(b.y+b.h)).forEach(drawObj);
 if(selected){let s=screen(selected.x,selected.y);$('selectionHud').style.display='block';$('selectionHud').style.left=(s.x-10)+'px';$('selectionHud').style.top=(s.y-selected.h*project.map.t*view.z/2-18)+'px';$('selectionLabel').textContent=selected.name}else $('selectionHud').style.display='none';
}
function render(){draw();renderSheet()}
canvas.addEventListener('pointerdown',e=>{
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 let p=world(e.offsetX,e.offsetY);
 if(pendingType){saveHistory();let o=obj(pendingType,Math.round(p.x*2)/2,Math.round(p.y*2)/2);project.objects.push(o);selected=o;pendingType=null;toast(o.name+' colocado');render();return}
 let o=hit(p);
 if(o){selected=o;drag={o,dx:p.x-o.x,dy:p.y-o.y};renderSheet();draw()}else{selected=null;pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};draw()}
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let p=world(e.offsetX,e.offsetY);if(drag){drag.o.x=p.x-drag.dx;drag.o.y=p.y-drag.dy;draw()}else if(pan){view.x=pan.vx+(e.clientX-pan.x);view.y=pan.vy+(e.clientY-pan.y);draw()}});
canvas.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);if(drag){saveHistory();drag=null}pan=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();let old=view.z;view.z=Math.max(.35,Math.min(3,view.z*(e.deltaY<0?1.08:.92)));let r=canvas.getBoundingClientRect();let sx=e.clientX-r.left,sy=e.clientY-r.top;view.x=sx-(sx-view.x)*(view.z/old);view.y=sy-(sy-view.y)*(view.z/old);draw()},{passive:false});

function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));openSheet(m)}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function openSheet(m){$('rightSheet').classList.add('open');let titles={build:'Construir',scenes:'Cenas',story:'História',audio:'Áudio',assets:'Arte / Assets'};$('sheetTitle').textContent=titles[m]||m;renderSheet()}
$('closeSheet').onclick=()=>$('rightSheet').classList.remove('open');
$('closeBottom').onclick=()=>$('bottomSheet').classList.remove('open');

function assetButtons(){let out='';for(let [cat,items] of ASSETS){out+=`<div class="card"><div class="cardTitle">${cat}</div><div class="assetGrid">${items.map(a=>`<button class="asset" data-place="${a[0]}"><div class="ico">${a[1]}</div><div><b>${a[2]}</b><small>toque para colocar</small></div></button>`).join('')}</div></div>`}return out}
function renderSheet(){
 if(mode==='build')$('sheetBody').innerHTML=`<div class="card"><div class="cardTitle">CRIAÇÃO RÁPIDA</div><button class="bigAction" id="roomBtn">🏥 Montar uma sala pronta</button><button class="bigAction" id="hallBtn">🚪 Criar corredor hospitalar</button><button class="bigAction" id="horrorBtn">☠️ Criar área de horror</button><button class="bigAction" id="clearBtn">🧹 Limpar cena</button></div>`+assetButtons();
 if(mode==='scenes')$('sheetBody').innerHTML=`<div class="card"><div class="cardTitle">CENAS DO JOGO</div>${['Recepção','Enfermaria','UTI','Corredor','Subsolo'].map((s,i)=>`<button class="bigAction" data-scene="${s}">${i===0?'🏥':'▦'} ${s}<span class="pill" style="float:right">${i<2?'EDITANDO':'CRIAR'}</span></button>`).join('')}</div><div class="card"><div class="cardTitle">CONFIGURAÇÃO VISUAL</div><div class="row"><button class="bigAction" id="zoomFit">◫ Enquadrar</button><button class="bigAction" id="gridBtn"># Grade</button></div></div>`;
 if(mode==='story')$('sheetBody').innerHTML=`<div class="card"><div class="cardTitle">CAPÍTULO</div><div class="field"><label>TÍTULO</label><input id="storyTitle" value="${esc(project.story.chapter)}"></div><div class="field"><label>ABERTURA</label><textarea id="storyIntro">${esc(project.story.intro)}</textarea></div><div class="field"><label>OBJETIVO ATUAL</label><input id="storyObj" value="${esc(project.story.objective)}"></div><button class="bigAction" id="addDialogue">＋ Adicionar diálogo</button></div><div class="card"><div class="cardTitle">DIÁLOGOS</div>${project.story.dialogues.map((d,i)=>`<div class="listItem"><div class="grow"><b>${esc(d.speaker)}</b><small>${esc(d.text)}</small></div><button class="miniBtn" data-dialog="${i}">✎</button></div>`).join('')}</div>`;
 if(mode==='audio')$('sheetBody').innerHTML=`<div class="card"><div class="cardTitle">SISTEMA DE ÁUDIO</div><button class="bigAction" id="musicToggle">🎵 Música: ${project.audio.music?'ATIVA':'DESLIGADA'}</button><button class="bigAction" id="ambToggle">🌧 Ambiente: ${project.audio.ambience?'ATIVO':'DESLIGADO'}</button><button class="bigAction" id="sfxToggle">💥 Efeitos: ${project.audio.sfx?'ATIVOS':'DESLIGADOS'}</button><button class="bigAction" id="testSfx">🔊 Testar som</button></div><div class="card"><div class="cardTitle">IMPORTAR</div><button class="bigAction" id="importAudio">＋ Importar música / efeito</button><small style="color:var(--muted)">Arquivos de áudio ficam associados ao projeto e podem ser usados nas cenas.</small></div>`;
 if(mode==='assets')$('sheetBody').innerHTML=`<div class="card"><div class="cardTitle">BIBLIOTECA</div><button class="bigAction" id="importAssets">＋ Importar imagens / texturas / sons</button><button class="bigAction" id="projectInfo">⚙ Configurações do jogo</button></div><div class="card"><div class="cardTitle">ARTE PROCEDURAL</div><button class="bigAction" id="generateHospital">✨ Gerar decoração hospitalar</button><button class="bigAction" id="generateHorror">🌑 Gerar atmosfera de horror</button></div>`;
 document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{pendingType=b.dataset.place;toast('Agora toque no cenário para colocar');});
 $('roomBtn')?.addEventListener('click',()=>presetRoom());$('hallBtn')?.addEventListener('click',()=>presetHall());$('horrorBtn')?.addEventListener('click',()=>presetHorror());$('clearBtn')?.addEventListener('click',()=>{saveHistory();project.objects=project.objects.filter(o=>o.type==='floor');selected=null;render()});
 document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{project.scene=b.dataset.scene;toast('Cena selecionada: '+b.dataset.scene);});
 $('zoomFit')?.addEventListener('click',fit);$('gridBtn')?.addEventListener('click',()=>{grid=!grid;draw()});
 $('storyTitle')?.addEventListener('change',e=>project.story.chapter=e.target.value);$('storyIntro')?.addEventListener('change',e=>project.story.intro=e.target.value);$('storyObj')?.addEventListener('change',e=>project.story.objective=e.target.value);
 $('addDialogue')?.addEventListener('click',()=>{project.story.dialogues.push({speaker:'Personagem',text:'Novo diálogo...'});renderSheet()});
 document.querySelectorAll('[data-dialog]').forEach(b=>b.onclick=()=>editDialogue(+b.dataset.dialog));
 $('musicToggle')?.addEventListener('click',()=>{project.audio.music=!project.audio.music;renderSheet()});$('ambToggle')?.addEventListener('click',()=>{project.audio.ambience=!project.audio.ambience;renderSheet()});$('sfxToggle')?.addEventListener('click',()=>{project.audio.sfx=!project.audio.sfx;renderSheet()});
 $('testSfx')?.addEventListener('click',beep);$('importAudio')?.addEventListener('click',()=>$('assetInput').click());$('importAssets')?.addEventListener('click',()=>$('assetInput').click());$('projectInfo')?.addEventListener('click',projectSettings);
 $('generateHospital')?.addEventListener('click',presetHospitalDecor);$('generateHorror')?.addEventListener('click',presetHorror);
 if(selected&&mode==='build') renderInspector();
}
function renderInspector(){
 if(!selected)return;
 let o=selected;
 $('sheetBody').insertAdjacentHTML('afterbegin',`<div class="card"><div class="cardTitle">SELECIONADO</div><div class="field"><label>NOME</label><input id="objName" value="${esc(o.name)}"></div><div class="row"><button class="bigAction" id="dup">⧉ Duplicar</button><button class="bigAction" id="del">🗑 Excluir</button></div></div>`);
 $('objName').onchange=e=>{saveHistory();o.name=e.target.value;draw()};
 $('dup').onclick=()=>{saveHistory();let n=cp(o);n.id=uid();n.x+=.8;n.y+=.8;n.name=o.name+' cópia';project.objects.push(n);selected=n;render()};
 $('del').onclick=()=>{saveHistory();project.objects=project.objects.filter(x=>x.id!==o.id);selected=null;render()};
}
function editDialogue(i){let d=project.story.dialogues[i];modal('Editar diálogo',`<div class="field"><label>PERSONAGEM</label><input id="ds" value="${esc(d.speaker)}"></div><div class="field"><label>FALA</label><textarea id="dt">${esc(d.text)}</textarea></div><button class="bigAction" id="ok">SALVAR</button>`);$('ok').onclick=()=>{d.speaker=$('ds').value;d.text=$('dt').value;closeModal();renderSheet()}}
function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}$('modalClose').onclick=closeModal;
function projectSettings(){modal('Configurações do jogo',`<div class="field"><label>NOME DO JOGO</label><input id="pn" value="${esc(project.name)}"></div><div class="field"><label>VERSÃO</label><input id="pv" value="${esc(project.appVersion)}"></div><div class="field"><label>QUALIDADE</label><select id="pq"><option ${project.settings.quality==='alta'?'selected':''}>alta</option><option ${project.settings.quality==='média'?'selected':''}>média</option><option>baixa</option></select></div><button class="bigAction" id="ps">SALVAR</button><button class="bigAction" id="exp">⬇ Exportar projeto</button><button class="bigAction" id="imp">⬆ Importar projeto</button>`);$('ps').onclick=()=>{project.name=$('pn').value;project.appVersion=$('pv').value;project.settings.quality=$('pq').value;$('projectName').textContent=project.name;closeModal()};$('exp').onclick=exportProject;$('imp').onclick=()=>$('projectInput').click()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function presetRoom(){saveHistory();for(let x=6;x<=28;x+=3)project.objects.push(obj('bed',x,8),obj('lamp',x,6));for(let x=5;x<=29;x+=4)project.objects.push(obj('locker',x,13));toast('Enfermaria criada');render()}
function presetHall(){saveHistory();for(let x=4;x<31;x+=2)project.objects.push(obj('lamp',x,4),obj('lamp',x,18));project.objects.push(obj('door',16,4),obj('door',24,4),obj('door',16,18));toast('Corredor criado');render()}
function presetHorror(){saveHistory();for(let i=0;i<10;i++)project.objects.push(obj('blood',6+Math.random()*22,5+Math.random()*12),obj('trash',6+Math.random()*22,5+Math.random()*12));project.objects.push(obj('corpse',13,12),obj('enemy',26,12));toast('Atmosfera criada');render()}
function presetHospitalDecor(){saveHistory();for(let i=0;i<12;i++)project.objects.push(obj('lamp',4+Math.random()*27,4+Math.random()*14,{radius:3+Math.random()*2}));toast('Iluminação adicionada');render()}
$('save').onclick=exportProject;
function exportProject(){let b=new Blob([JSON.stringify(project,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(project.name||'o-hospital').replace(/[^a-z0-9_-]+/gi,'_')+'.ohospital.json';a.click();URL.revokeObjectURL(a.href);toast('Projeto exportado')}
$('projectInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{project=JSON.parse(r.result);selected=null;$('projectName').textContent=project.name;render();toast('Projeto importado')}catch{toast('Arquivo de projeto inválido')}};r.readAsText(f)};
$('assetInput').onchange=e=>{for(const f of e.target.files){project.assets.push({name:f.name,type:f.type,size:f.size});}toast(e.target.files.length+' arquivo(s) associado(s) ao projeto')};

let audioCtx=null;
function beep(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=520;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.08,audioCtx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.16);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.18)}

let game={running:false,t:0,x:17,y:16,vx:0,vy:0,hp:100,run:false,joy:{x:0,y:0},near:null,dialogue:0,inventory:[]};
function startGame(){game={...game,running:true,t:0,x:17,y:16,vx:0,vy:0,hp:100,run:false,joy:{x:0,y:0},near:null,dialogue:0,inventory:[]};$('playOverlay').classList.add('open');resizeGame();gameLoop(performance.now());}
function stopGame(){$('playOverlay').classList.remove('open');game.running=false}
$('play').onclick=startGame;
$('playOverlay').addEventListener('dblclick',stopGame);
function resizeGame(){let r=gameCanvas.getBoundingClientRect();gameCanvas.width=r.width*DPR;gameCanvas.height=r.height*DPR;gctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resizeGame);
function iso(x,y){let s=Math.min(gameCanvas.clientWidth,gameCanvas.clientHeight)/25;return{x:gameCanvas.clientWidth/2+(x-y)*s*.62,y:gameCanvas.clientHeight/2+(x+y)*s*.32}}
function gameLoop(now){if(!game.running)return;let dt=Math.min(.033,(now-(game.last||now))/1000);game.last=now;updateGame(dt);drawGame();requestAnimationFrame(gameLoop)}
function updateGame(dt){
 let sp=game.run?3.5:2.0;game.x+=game.joy.x*sp*dt;game.y+=game.joy.y*sp*dt;game.x=Math.max(1.5,Math.min(32.5,game.x));game.y=Math.max(1.5,Math.min(20.5,game.y));
 for(const e of project.objects.filter(o=>o.type==='enemy')){let dx=game.x-e.x,dy=game.y-e.y,d=Math.hypot(dx,dy);if(d<e.vision){e._gx=(dx/d)*e.speed;e._gy=(dy/d)*e.speed;e._gx*=dt;e._gy*=dt;e._x=(e._x||e.x)+e._gx;e._y=(e._y||e.y)+e._gy;if(d<.7)game.hp=Math.max(0,game.hp-e.damage*dt)}}
 let nearest=null,nd=1.25;for(const o of project.objects){let ox=o._x??o.x,oy=o._y??o.y,d=Math.hypot(game.x-ox,game.y-oy);if(o.interactive&&d<nd){nearest=o;nd=d}}game.near=nearest;
 $('hpbar').style.width=Math.max(0,game.hp)+'%';$('hpText').textContent=Math.round(game.hp);$('objective').textContent=project.story.objective;
}
function drawGame(){
 let w=gameCanvas.clientWidth,h=gameCanvas.clientHeight;gctx.clearRect(0,0,w,h);
 let bg=gctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#07100d');bg.addColorStop(1,'#18201b');gctx.fillStyle=bg;gctx.fillRect(0,0,w,h);
 // pseudo 2.5D room
 let s=Math.min(w,h)/25;gctx.save();gctx.translate(w/2,h/2);
 for(let y=0;y<22;y++)for(let x=0;x<34;x++){let p=iso(x,y);let q=iso(x+1,y);let r=iso(x+1,y+1);let z=iso(x,y+1);gctx.fillStyle=(x+y)%2?'#202923':'#1c241f';gctx.beginPath();gctx.moveTo(p.x-w/2,p.y-h/2);gctx.lineTo(q.x-w/2,q.y-h/2);gctx.lineTo(r.x-w/2,r.y-h/2);gctx.lineTo(z.x-w/2,z.y-h/2);gctx.closePath();gctx.fill()}
 gctx.restore();
 const arr=project.objects.map(o=>({...o,x:o._x??o.x,y:o._y??o.y})).filter(o=>o.type!=='floor').sort((a,b)=>(a.x+a.y)-(b.x+b.y));
 for(const o of arr){let p=iso(o.x,o.y);let c=colors[o.type]||'#777';let depth=(o.type==='wall'||o.type==='door')?14:5;gctx.fillStyle='#0007';gctx.beginPath();gctx.ellipse(p.x+4,p.y+7,Math.max(5,o.w*s*.35),Math.max(2,o.h*s*.16),0,0,7);gctx.fill();gctx.fillStyle=shade(c,.65);gctx.beginPath();gctx.moveTo(p.x-o.w*s*.4,p.y-o.h*s*.22);gctx.lineTo(p.x+o.w*s*.4,p.y-o.h*s*.22);gctx.lineTo(p.x+o.w*s*.4,p.y+o.h*s*.22+depth);gctx.lineTo(p.x-o.w*s*.4,p.y+o.h*s*.22+depth);gctx.closePath();gctx.fill();gctx.fillStyle=c;gctx.beginPath();gctx.moveTo(p.x-o.w*s*.4,p.y-o.h*s*.22);gctx.lineTo(p.x,p.y-o.h*s*.4);gctx.lineTo(p.x+o.w*s*.4,p.y-o.h*s*.22);gctx.lineTo(p.x,p.y);gctx.closePath();gctx.fill()}
 let pp=iso(game.x,game.y);gctx.fillStyle='#0008';gctx.beginPath();gctx.ellipse(pp.x,pp.y+10,12,5,0,0,7);gctx.fill();gctx.fillStyle='#dff59a';gctx.beginPath();gctx.arc(pp.x,pp.y-3,10,0,7);gctx.fill();gctx.fillStyle='#25321e';gctx.beginPath();gctx.arc(pp.x-3,pp.y-5,2,0,7);gctx.arc(pp.x+3,pp.y-5,2,0,7);gctx.fill();
}
let joyEl=$('joy'),knob=$('knob');
function setJoy(e){let r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.min(45,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);game.joy.x=Math.cos(a)*(m/45);game.joy.y=Math.sin(a)*(m/45);knob.style.transform=`translate(${Math.cos(a)*m}px,${Math.sin(a)*m}px)`}
joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);setJoy(e)});joyEl.addEventListener('pointermove',e=>{if(e.buttons)setJoy(e)});joyEl.addEventListener('pointerup',()=>{game.joy.x=game.joy.y=0;knob.style.transform='translate(0,0)'});
$('runBtn').onpointerdown=()=>game.run=true;$('runBtn').onpointerup=()=>game.run=false;
$('actBtn').onclick=()=>{if(game.near){let o=game.near;if(o.type==='npc'){let d=project.story.dialogues[game.dialogue%project.story.dialogues.length];$('speaker').textContent=d?.speaker||o.name;$('dialogueText').textContent=d?.text||o.dialogue||'...';$('dialogue').style.display='block';game.dialogue++}else if(o.type==='item'||o.type==='weapon'){game.inventory.push(o.itemId);toast('Item coletado: '+o.name);o.interactive=false}else beep()}};
$('dialogueNext').onclick=()=>{$('dialogue').style.display='none'};
$('workspace').addEventListener('click',e=>{if(e.target===canvas)return});
function openBottom(){}
render();setTimeout(resize,50);setTimeout(fit,80);
</script>
